networks:
  1panel-network:
    external: true
services:
  pt-tools:
    container_name: pt-tools
    env_file:
    - ./envs/global.env
    - .env
    environment:
    - TZ=Asia/Shanghai
    - PT_WEB=1
    - PT_HOST=0.0.0.0
    - PT_PORT=8080
    - PUID=1000
    - PGID=1000
    image: sunerpy/pt-tools:v1.1.2
    labels:
      createdBy: Apps
    networks:
    - 1panel-network
    ports:
    - ${PANEL_APP_PORT_HTTP}:8080
    restart: always
    volumes:
    - ${PT_TOOLS_ROOT_PATH}/data:/app/.pt-tools

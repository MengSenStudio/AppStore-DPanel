networks:
  1panel-network:
    external: true
services:
  mdc-ng:
    container_name: mdc-ng
    env_file:
    - ./envs/global.env
    - .env
    environment:
      TZ: Europe/Rome
    image: leolitaly/mdc-ngi:26.9.1
    labels:
      createdBy: Apps
    networks:
    - 1panel-network
    ports:
    - ${PANEL_APP_PORT_HTTP}:19218
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    stop_grace_period: 40s
    user: 0:0
    volumes:
    - ${MDC_NG_ROOT_PATH}/data:/data
